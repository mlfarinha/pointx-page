<!doctype html>
<meta charset="utf-8">
<title>viewer check</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>html,body{margin:0;height:100%;background:#fff}#stage{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#1b1f27,#0b0d11)}canvas{width:100%;height:100%;display:block}</style>
<div id="stage"></div>
<script type="module">
import { SceneViewer, fetchGz } from "./js/viewer.js";
const q = new URLSearchParams(location.search);
const v = new SceneViewer(document.getElementById("stage"));
window.viewer = v;
if (q.get("tweak")) v.tweak = q.get("tweak").split(",").map(Number);
const base = `${q.get("base") || "assets/scenes/"}${q.get("scene") || "einstein_1"}/`;
await v.load(base);
if (q.get("cmp")) { const [a, b] = await Promise.all(q.get("cmp").split(",").map(n => fetchGz(base + n + ".bin.gz").then(x => new Uint8Array(x)))); v.setCompare(a, b); v.setSplit(0.5); }
v.setReveal(q.get("reveal") === "1");
if (q.get("channel")) v.setChannel(q.get("channel"));
v.setFrame(Number(q.get("frame") || 60));
if (q.get("follow") === "1") v.setFollow(true);
if (q.get("cull") === "0") v.setCull(false);
if (q.get("gizmos") === "0") v.setGizmos(false);
window.ready = true;
</script>
